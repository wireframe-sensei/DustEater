name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build (arm64)
        run: swift build -c release --arch arm64

      - name: Upload arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: dusteater-arm64
          path: .build/arm64-apple-macosx/release/DustEaterApp
          retention-days: 1

  build-x86_64:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build (x86_64)
        run: swift build -c release --arch x86_64

      - name: Upload x86_64 binary
        uses: actions/upload-artifact@v4
        with:
          name: dusteater-x86_64
          path: .build/x86_64-apple-macosx/release/DustEaterApp
          retention-days: 1

  assemble-and-release:
    needs: [ build-arm64, build-x86_64 ]
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: dusteater-arm64
          path: bin-arm64

      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: dusteater-x86_64
          path: bin-x86_64

      - name: Assemble universal binary
        run: |
          mkdir -p build
          lipo -create -output build/DustEaterApp \
            bin-arm64/DustEaterApp \
            bin-x86_64/DustEaterApp
          lipo -info build/DustEaterApp

      - name: Assemble .app bundle
        run: |
          APP="build/DustEater.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp build/DustEaterApp "$APP/Contents/MacOS/DustEaterApp"
          chmod +x "$APP/Contents/MacOS/DustEaterApp"
          cp Packaging/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          sed "s/__VERSION__/${{ steps.version.outputs.version }}/g" \
            Packaging/Info.plist > "$APP/Contents/Info.plist"

      - name: Ad-hoc codesign
        run: codesign --force --deep --sign - "build/DustEater.app"

      - name: Create DMG
        run: |
          rm -rf dmg-root
          mkdir -p dmg-root
          cp -R "build/DustEater.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "DustEater" -srcfolder dmg-root -ov -format UDZO \
            "DustEater-${{ steps.version.outputs.version }}.dmg"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "DustEater-${{ steps.version.outputs.version }}.dmg" \
            --title "DustEater ${{ github.ref_name }}" \
            --generate-notes \
            --notes "**This build is unsigned.** macOS Gatekeeper will say it's from an unidentified developer or that it's damaged. After dragging DustEater.app to Applications, either right-click it and choose **Open** (then confirm), or run: \`xattr -cr /Applications/DustEater.app\`. See the README for details."
